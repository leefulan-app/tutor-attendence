<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------- small inline icons (no external icon dependency) ---------- */

    strokeLinecap="round" strokeLinejoin="round" className={className}>

);
const IconPlus = (p) => <Icon {...p} path="M12 5v14M5 12h14" />;
const IconBack = (p) => <Icon {...p} path="M15 18l-6-6 6-6" />;

const IconCloud = (p) => <Icon {...p} path="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z" />;
const IconLink = (p) => <Icon {...p} path="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" />;
const IconMail = (p) => <Icon {...p} path="M4 4h16v16H4V4zm0 0l8 8 8-8" />;
const IconCalendarCheck = (p) => <Icon {...p} path="M8 2v4M16 2v4M3 10h18M3 6h18v14a1 1 0 01-1 1H4a1 1 0 01-1-1V6zM9 16l2 2 4-4" />;

/* ---------- domain logic ---------- */
// local (Taipei) calendar date, NOT UTC — toISOString() shifts dates by a day before 8am in UTC+8
const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayStr = () => localDateStr(new Date());
const uid = () => Math.random().toString(36).slice(2, 10);

// income "months" run from the 5th of a month to the 4th of the next month.
// a date on the 1st-4th belongs to the PREVIOUS calendar month's period.
function incomeMonthKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  let y = d.getFullYear(), m = d.getMonth();
  if (d.getDate() < 5) { m -= 1; if (m < 0) { m = 11; y -= 1; } }
  return `${y}-${String(m + 1).padStart(2, "0")}`;
}
const monthLabel = (ym) => {
  const [y, m] = ym.split("-").map((v) => parseInt(v, 10));
  const endM = m === 12 ? 1 : m + 1;
  const endY = m === 12 ? y + 1 : y;
  return `${y}/${m}/5 – ${endY}/${endM}/4`;
};
const monthLabelShort = (ym) => {
  const [y, m] = ym.split("-").map((v) => parseInt(v, 10));
  const endM = m === 12 ? 1 : m + 1;
  return `${m}/5-${endM}/4`;
};
const fmtDate = (d) => { const dt = new Date(d + "T00:00:00"); return `${dt.getMonth() + 1}/${dt.getDate()}`; };
const fmtMoney = (n) => Math.round(n).toLocaleString("zh-TW");

// per-class income: if the hourly rate is under 100, treat it as a per-minute
// rate and multiply by 30; otherwise use the normal rate × session length.
// if dateStr is given, uses the rate that was in effect on that date (rate history).
function perClassAmount(student, dateStr) {
  const rate = dateStr ? getRateForDate(student, dateStr) : getCurrentRate(student);
  return rate < 100 ? rate * 30 : rate * student.sessionHours;
}

// --- hourly-rate history: lets a future rate change apply only going forward,
// without silently recalculating past months' income at the new rate.
function getCurrentRate(student) {
  if (Array.isArray(student.rateHistory) && student.rateHistory.length) {
    return student.rateHistory[student.rateHistory.length - 1].hourlyRate;
  }
  return student.hourlyRate;
}
function getRateForDate(student, dateStr) {
  if (Array.isArray(student.rateHistory) && student.rateHistory.length) {
    let rate = student.rateHistory[0].hourlyRate;
    for (const entry of student.rateHistory) {
      if (entry.effectiveDate <= dateStr) rate = entry.hourlyRate; else break;
    }
    return rate;
  }
  return student.hourlyRate;
}
function setStudentRate(student, newRate, effectiveDate) {
  const base = Array.isArray(student.rateHistory) && student.rateHistory.length
    ? [...student.rateHistory]
    : [{ effectiveDate: "1970-01-01", hourlyRate: student.hourlyRate }];
  const idx = base.findIndex((h) => h.effectiveDate === effectiveDate);
  if (idx >= 0) base[idx] = { effectiveDate, hourlyRate: newRate };
  else base.push({ effectiveDate, hourlyRate: newRate });
  base.sort((a, b) => (a.effectiveDate < b.effectiveDate ? -1 : 1));
  return { ...student, rateHistory: base, hourlyRate: newRate };
}

function newStudent(name, hourlyRate, sessionHours, classesPerCycle, viaPlatform, weekdays, email, freeLeaves) {
  return {
    id: uid(), name, hourlyRate, sessionHours,
    classesPerCycle: classesPerCycle || 10,
    viaPlatform: !!viaPlatform,
    weekdays: weekdays || [],
    email: email || "",
    freeLeaves: (freeLeaves == null || freeLeaves === "") ? 2 : freeLeaves,
    status: "active",
    sessions: [],
    cyclePayments: {},
  };
}

// --- backward-compat readers: old saved data may still have a nested `cycles` array
// instead of a flat `sessions` list. These let every part of the app read either shape
// transparently; a student is fully migrated to the new shape the next time they're edited.
function getSessions(student) {
  if (Array.isArray(student.sessions)) return student.sessions;
  if (Array.isArray(student.cycles)) return student.cycles.flatMap((c) => c.sessions || []);
  return [];
}
function getCyclePayments(student) {
  if (student.cyclePayments) return student.cyclePayments;
  if (Array.isArray(student.cycles)) {
    const map = {};
    student.cycles.forEach((c, i) => { if (c.paidDate) map[i] = c.paidDate; });
    return map;
  }
  return {};
}
// a payment entry may be a legacy plain date string (paidDate only), or the
// newer { paidDate, notifiedDate } shape
function normalizePaymentEntry(entry) {
  if (!entry) return { paidDate: null, notifiedDate: null };
  if (typeof entry === "string") return { paidDate: entry, notifiedDate: null };
  return { paidDate: entry.paidDate || null, notifiedDate: entry.notifiedDate || null };
}

// Derive cycles fresh from the flat, chronologically-sorted session list every time.
// This is what makes backfilled (late-entered) records land in the correct round
// instead of always spilling into whichever round is currently open.
// Round length history: [{from:"YYYY-MM-DD", n}]. A round's length is fixed by the
// date of its FIRST session, so changing the setting never reshuffles past rounds.
function cycleLenFor(student, dateStr) {
  const h = student.cycleLenHistory;
  const fallback = student.classesPerCycle || 10;
  if (!Array.isArray(h) || h.length === 0) return fallback;
  const sortedH = [...h].sort((a, b) => (a.from < b.from ? -1 : 1));
  let n = sortedH[0].n;
  sortedH.forEach((e) => { if (e.from <= dateStr) n = e.n; });
  return n;
}
function setStudentCycleLen(student, n, fromDate) {
  if (!n || n === (student.classesPerCycle || 10)) return { ...student, classesPerCycle: n || student.classesPerCycle };
  const old = student.classesPerCycle || 10;
  const base = Array.isArray(student.cycleLenHistory) && student.cycleLenHistory.length
    ? student.cycleLenHistory.filter((e) => e.from < fromDate)
    : [{ from: "0000-00-00", n: old }];
  return { ...student, classesPerCycle: n, cycleLenHistory: [...base, { from: fromDate, n }] };
}
function getCycles(student) {
  const payments = getCyclePayments(student);
  const sorted = [...getSessions(student)].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1)));
  const cycles = [];
  let current = { id: "cycle-0", sessions: [], completedAt: null, total: null };
  let n = 0, idx = 0;
  sorted.forEach((s) => {
    if (current.sessions.length === 0) current.total = cycleLenFor(student, s.date);
    current.sessions.push(s);
    if (s.type === "class" || s.type === "noshow") {
      n++;
      if (n >= current.total) {
        current.completedAt = s.date;
        cycles.push(current);
        idx++;
        current = { id: "cycle-" + idx, sessions: [], completedAt: null, total: null };
        n = 0;
      }
    }
  });
  if (current.total == null) current.total = cycleLenFor(student, "9999-12-31");
  cycles.push(current);
  return cycles.map((c, i) => ({ ...c, ...normalizePaymentEntry(payments[i]) }));
}

const classCount = (cycle) => cycle.sessions.filter((s) => s.type === "class" || s.type === "noshow").length;
const leaveCount = (cycle) => cycle.sessions.filter((s) => s.type === "leave").length;
const WEEKDAY_LABELS = ["日", "一", "二", "三", "四", "五", "六"];
const weekdaysLabel = (weekdays) => (weekdays && weekdays.length ? [...weekdays].sort((a, b) => WEEKDAY_DISPLAY_ORDER.indexOf(a) - WEEKDAY_DISPLAY_ORDER.indexOf(b)).map((d) => WEEKDAY_LABELS[d]).join("、") : "");

// find the next date (after afterDateStr) that falls on one of the given weekdays
function nextExpectedDate(afterDateStr, weekdays) {
  if (!weekdays || weekdays.length === 0) return null;
  let d = new Date(afterDateStr + "T00:00:00");
  d.setDate(d.getDate() + 1);
  for (let i = 0; i < 14; i++) {
    if (weekdays.includes(d.getDay())) return localDateStr(d);
    d.setDate(d.getDate() + 1);
  }
  return null;
}

// Predict the payment deadline for the CURRENT (in-progress) cycle: project forward
// from its most recent recorded date through the student's weekday pattern, counting
// off the remaining classes needed — the deadline is the class-day right after that
// (i.e. the first day of the next cycle). Because this starts counting from the most
// recently recorded session (class OR leave), a newly-recorded leave automatically
// pushes the date later, since it consumes a weekday slot without counting as a class.
function predictedCycleDeadline(cycle, weekdays, classesPerCycle) {
  if (!weekdays || weekdays.length === 0) return null;
  const remaining = classesPerCycle - classCount(cycle);
  if (remaining <= 0) return null;
  const sorted = [...cycle.sessions].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const fromDate = sorted.length ? sorted[sorted.length - 1].date : todayStr();
  let d = new Date(fromDate + "T00:00:00");
  let count = 0;
  for (let i = 0; i < 120; i++) {
    d.setDate(d.getDate() + 1);
    if (weekdays.includes(d.getDay())) {
      count++;
      if (count === remaining + 1) return localDateStr(d);
    }
  }
  return null;
}

// unpaid upcoming cycles for a student: for each completed cycle, check whether
// the FOLLOWING cycle (the one it's prepaying for) has been marked paid OR notified
function unpaidCycles(student) {
  const cycles = getCycles(student);
  const result = [];
  for (let i = 0; i < cycles.length - 1; i++) {
    const c = cycles[i];
    const next = cycles[i + 1];
    if (c.completedAt && !next.paidDate && !next.notifiedDate) {
      result.push({ cycle: next, expectedNext: nextExpectedDate(c.completedAt, student.weekdays), completedAt: c.completedAt });
    }
  }
  return result;
}

function addSessionToStudent(student, date, type) {
  const sessions = [...getSessions(student), { id: uid(), date, type }];
  const cyclePayments = getCyclePayments(student);
  const { cycles, ...rest } = student;
  return { ...rest, sessions, cyclePayments };
}

function setCyclePaidDate(student, cycleId, paidDate) {
  const idx = parseInt(String(cycleId).replace("cycle-", ""), 10);
  const cyclePayments = { ...getCyclePayments(student) };
  const cur = normalizePaymentEntry(cyclePayments[idx]);
  const next = { ...cur, paidDate };
  if (!next.paidDate && !next.notifiedDate) delete cyclePayments[idx]; else cyclePayments[idx] = next;
  const { cycles, ...rest } = student;
  return { ...rest, sessions: getSessions(student), cyclePayments };
}

function setCycleNotifiedDate(student, cycleId, notifiedDate) {
  const idx = parseInt(String(cycleId).replace("cycle-", ""), 10);
  const cyclePayments = { ...getCyclePayments(student) };
  const cur = normalizePaymentEntry(cyclePayments[idx]);
  const next = { ...cur, notifiedDate };
  if (!next.paidDate && !next.notifiedDate) delete cyclePayments[idx]; else cyclePayments[idx] = next;
  const { cycles, ...rest } = student;
  return { ...rest, sessions: getSessions(student), cyclePayments };
}

function removeSessionFromStudent(student, sessionId) {
  const sessions = getSessions(student).filter((s) => s.id !== sessionId);
  const cyclePayments = getCyclePayments(student);
  const { cycles, ...rest } = student;
  return { ...rest, sessions, cyclePayments };
}

// leaves beyond the free allowance (in date order) within a cycle are "charged" as if a class happened
function chargedLeaveIds(cycle, freeLeaves) {
  const n = freeLeaves == null ? 2 : freeLeaves;
  const leaves = cycle.sessions.filter((s) => s.type === "leave").sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const charged = new Set();
  leaves.forEach((s, idx) => { if (idx >= n) charged.add(s.id); });
  return charged;
}

function monthlyIncomeByMonth(students) {
  const map = {};
  students.forEach((st) => {
    getCycles(st).forEach((c) => {
      const charged = chargedLeaveIds(c, st.freeLeaves);
      c.sessions.forEach((s) => {
        const counts = s.type === "class" || s.type === "noshow" || (s.type === "leave" && charged.has(s.id));
        if (!counts) return;
        const ym = incomeMonthKey(s.date);
        if (!map[ym]) map[ym] = { total: 0, byStudent: {} };
        const amt = perClassAmount(st, s.date);
        map[ym].total += amt;
        map[ym].byStudent[st.id] = (map[ym].byStudent[st.id] || 0) + amt;
      });
    });
  });
  return map;
}

// per calendar year: actual class count, leave count, refund eligibility & amount
function annualSummary(student, year) {
  let classCount = 0, leaveCount = 0, longLeaveCount = 0, teacherLeaveCount = 0, chargedAmount = 0, chargedCount = 0;
  const chargedAmts = [];
  getCycles(student).forEach((cycle) => {
    const charged = chargedLeaveIds(cycle, student.freeLeaves);
    cycle.sessions.forEach((s) => {
      if (parseInt(s.date.slice(0, 4), 10) !== year) return;
      if (s.type === "class" || s.type === "noshow") classCount++;
      else if (s.type === "longleave") longLeaveCount++;
      else if (s.type === "teacherleave") teacherLeaveCount++;
      else {
        leaveCount++;
        if (charged.has(s.id)) { const a = getRateForDate(student, s.date) * student.sessionHours; chargedAmount += a; chargedCount++; chargedAmts.push({ date: s.date, a }); }
      }
    });
  });
  const threshold = Math.ceil(classCount / 4);
  // main result counts long leave toward the year's leaves; the "excl." result ignores it
  const eligible = classCount > 0 && leaveCount + longLeaveCount <= threshold;
  const eligibleExcl = classCount > 0 && leaveCount <= threshold;
  // teacher-leave credits (any round in the year) waive that many charged leaves, earliest first,
  // even when the 1/4 rule isn't met; when the rule IS met everything charged is refunded anyway.
  const waived = Math.min(teacherLeaveCount, chargedAmts.length);
  const creditRefund = [...chargedAmts].sort((x, y) => (x.date < y.date ? -1 : 1)).slice(0, waived).reduce((t, x) => t + x.a, 0);
  return { year, classCount, leaveCount, longLeaveCount, teacherLeaveCount, creditWaived: waived, threshold, eligible, refund: eligible ? chargedAmount : creditRefund, eligibleExcl, refundExcl: eligibleExcl ? chargedAmount : creditRefund, chargedAmount, chargedCount };
}

function yearsWithData(students) {
  const set = new Set();
  students.forEach((st) => getSessions(st).forEach((s) => set.add(parseInt(s.date.slice(0, 4), 10))));
  set.add(new Date().getFullYear());
  return Array.from(set).sort((a, b) => b - a);
}

/* ---------- Google Drive sync layer ---------- */
const CLIENT_ID_KEY = "tutor_drive_client_id";
const DRIVE_FILE_NAME = "tutor-ledger-data.json";
const SCOPES = "https://www.googleapis.com/auth/drive.file";

function useDriveSync() {
  const [clientId, setClientIdState] = useState(localStorage.getItem(CLIENT_ID_KEY) || "");
  const [signedIn, setSignedIn] = useState(false);
  const [authError, setAuthError] = useState("");
  const [fileId, setFileId] = useState(null);
  const tokenRef = useRef(null);
  const tokenClientRef = useRef(null);

  const setClientId = (id) => {
    localStorage.setItem(CLIENT_ID_KEY, id);
    setClientIdState(id);
  };

  const ensureTokenClient = useCallback(() => {
    if (!window.google || !clientId) return null;
    if (!tokenClientRef.current) {
      tokenClientRef.current = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: SCOPES,
        callback: () => {},
      });
    }
    return tokenClientRef.current;
  }, [clientId]);

  const signIn = useCallback(() => {
    setAuthError("");
    const tc = ensureTokenClient();
    if (!tc) { setAuthError("尚未設定 Client ID"); return; }
    tc.callback = (resp) => {
      if (resp.error) { setAuthError("登入失敗：" + resp.error); return; }
      tokenRef.current = resp.access_token;
      setSignedIn(true);
    };
    tc.requestAccessToken({ prompt: "" });
  }, [ensureTokenClient]);

  const authedFetch = useCallback(async (url, opts = {}) => {
    const res = await fetch(url, {
      ...opts,
      headers: { ...(opts.headers || {}), Authorization: `Bearer ${tokenRef.current}` },
    });
    if (res.status === 401) throw new Error("授權過期，請重新登入");
    return res;
  }, []);

  const findOrCreateFile = useCallback(async () => {
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const res = await authedFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
    const data = await res.json();
    if (data.files && data.files.length > 0) return data.files[0].id;
    const createRes = await authedFetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: "application/json" }),
    });
    const created = await createRes.json();
    await authedFetch(`https://www.googleapis.com/upload/drive/v3/files/${created.id}?uploadType=media`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ students: [] }),
    });
    return created.id;
  }, [authedFetch]);

  const loadData = useCallback(async () => {
    const id = fileId || (await findOrCreateFile());
    if (!fileId) setFileId(id);
    const res = await authedFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    const json = await res.json();
    return Array.isArray(json.students) ? json.students : [];
  }, [fileId, findOrCreateFile, authedFetch]);

  const saveData = useCallback(async (students) => {
    const id = fileId || (await findOrCreateFile());
    if (!fileId) setFileId(id);
    await authedFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ students }),
    });
  }, [fileId, findOrCreateFile, authedFetch]);

  const ensureStudentPublicFile = useCallback(async (student) => {
    const name = `student-public-${student.id}.json`;
    const q = encodeURIComponent(`name='${name}' and trashed=false`);
    const res = await authedFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
    const data = await res.json();
    let id;
    if (data.files && data.files.length > 0) {
      id = data.files[0].id;
    } else {
      const createRes = await authedFetch("https://www.googleapis.com/drive/v3/files", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, mimeType: "application/json" }),
      });
      const created = await createRes.json();
      id = created.id;
      await authedFetch(`https://www.googleapis.com/drive/v3/files/${id}/permissions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: "reader", type: "anyone" }),
      });
    }
    return id;
  }, [authedFetch]);

  const writeStudentPublicFile = useCallback(async (fileId, payload) => {
    await authedFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  }, [authedFetch]);

  return { clientId, setClientId, signedIn, authError, signIn, loadData, saveData, ensureStudentPublicFile, writeStudentPublicFile };
}

/* ---------- shared small components ---------- */
function Tally({ cycle, total }) {
  const n = total || 10;
  const classes = cycle.sessions.filter((s) => s.type === "class" || s.type === "noshow");
  const leaves = cycle.sessions.filter((s) => s.type === "leave");
  const marks = Array.from({ length: n }, (_, i) => (classes[i] ? "class" : "empty"));
  const dotWidth = n > 14 ? "4px" : "7px";

// Custom date picker so the week starts on Monday (native <input type="date"> follows the
// device's locale and can't be configured).
function DatePicker({ value, onChange, className }) {
  const [open, setOpen] = useState(false);
  const init = value ? new Date(value + "T00:00:00") : new Date();
  const [view, setView] = useState({ y: init.getFullYear(), m: init.getMonth() });
  const toggle = () => {
    if (!open) { const d = value ? new Date(value + "T00:00:00") : new Date(); setView({ y: d.getFullYear(), m: d.getMonth() }); }
    setOpen(!open);
  };
  const first = new Date(view.y, view.m, 1);
  const offset = (first.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(view.y, view.m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const shift = (n) => { const d = new Date(view.y, view.m + n, 1); setView({ y: d.getFullYear(), m: d.getMonth() }); };
  const today = todayStr();
  const fmt = (d) => `${view.y}-${String(view.m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  return (
    <div className={open ? "w-full" : "inline-block"}>
      <button type="button" onClick={toggle} className={(className || "") + " " + (open ? "w-full" : "")}>{value || "選擇日期"}</button>
      {open && (
        <div className="mt-1 mb-2 bg-white border border-[#DEDACB] rounded-xl p-3 w-full max-w-[280px]">
          <div className="flex items-center justify-between mb-2">
            <button type="button" onClick={() => shift(-1)} className="px-2 py-1 text-[#16302B] text-[15px]">‹</button>
            <span className="text-[13.5px] font-medium text-[#16302B]">{view.y} 年 {view.m + 1} 月</span>
            <button type="button" onClick={() => shift(1)} className="px-2 py-1 text-[#16302B] text-[15px]">›</button>
          </div>
          <div className="grid grid-cols-7 text-center text-[11px] text-[#8A8676] mb-1">
            {["一", "二", "三", "四", "五", "六", "日"].map((w) => <div key={w}>{w}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-y-0.5 text-center">
            {cells.map((d, i) => d == null ? <div key={i} /> : (
              <button type="button" key={i} onClick={() => { onChange(fmt(d)); setOpen(false); }}
                className={"h-8 rounded-full text-[13px] tabular-nums " + (fmt(d) === value ? "bg-[#16302B] text-white" : fmt(d) === today ? "border border-[#0F6B5C] text-[#0F6B5C]" : "text-[#16302B]")}>{d}</button>
            ))}
          </div>
          <div className="flex justify-between mt-2">
            <button type="button" onClick={() => { onChange(today); setOpen(false); }} className="text-[12px] text-[#0F6B5C] font-medium px-1 py-1">今天</button>
            <button type="button" onClick={() => setOpen(false)} className="text-[12px] text-[#8A8676] px-1 py-1">關閉</button>
          </div>
        </div>
      )}
    </div>
  );
}

function daysElapsedInPeriod(periodKey) {
  const [y, m] = periodKey.split("-").map(Number);
  const start = new Date(y, m - 1, 5);
  const today = new Date();
  const days = Math.floor((today - start) / 86400000) + 1;
  return Math.max(1, days);
}

function IncomeView({ students }) {
  const incomeMap = useMemo(() => monthlyIncomeByMonth(students), [students]);
  const months = useMemo(() => { const s = new Set(Object.keys(incomeMap)); s.add(incomeMonthKey(todayStr())); return Array.from(s).sort().reverse(); }, [incomeMap]);
  const [selected, setSelected] = useState(months[0]);
  useEffect(() => { if (!months.includes(selected)) setSelected(months[0]); }, [months]); // eslint-disable-line
  const data = incomeMap[selected] || { total: 0, byStudent: {} };
  const rows = students.filter((st) => data.byStudent[st.id]).map((st) => ({ id: st.id, name: st.name, amt: data.byStudent[st.id] })).sort((a, b) => b.amt - a.amt);
  const isCurrentPeriod = selected === incomeMonthKey(todayStr());
  const daysElapsed = isCurrentPeriod ? Math.min(daysElapsedInPeriod(selected), 30) : null;
  const estimate = isCurrentPeriod && daysElapsed > 0 ? (data.total / daysElapsed) * 30 : null;
  return (
    <div className="px-4 pt-4 pb-10">
      <div className="flex items-center gap-2 mb-4 overflow-x-auto no-scrollbar">
        {months.map((m) => (
          <button key={m} onClick={() => setSelected(m)} className={"shrink-0 px-3 py-1.5 rounded-full text-[13px] font-medium border " + (m === selected ? "bg-[#16302B] text-white border-[#16302B]" : "bg-white text-[#16302B] border-[#DEDACB]")}>{monthLabelShort(m)}</button>
        ))}
      </div>
      <div className="bg-[#16302B] rounded-2xl p-5 mb-5 text-white">
        <div className="text-[12px] text-[#B9D4CB] mb-1">{monthLabel(selected)}教學收入</div>
        <div className="font-serif text-[32px] tabular-nums">${fmtMoney(data.total)}</div>
        <div className="text-[12px] text-[#B9D4CB] mt-1">依實際上課堂數 × 時薪計算</div>
        {estimate != null && (
          <div className="mt-3 pt-3 border-t border-white/15">
            <div className="text-[12px] text-[#B9D4CB]">預估本期總收入（依目前 {daysElapsed} 天平均推算）</div>
            <div className="text-[20px] font-medium tabular-nums">${fmtMoney(estimate)}</div>
          </div>
        )}
      </div>
      <div className="space-y-2">
        {rows.length === 0 && <div className="text-center text-[#B9B6A8] text-[14px] py-10">這個月還沒有上課紀錄</div>}
        {rows.map((r) => (
          <div key={r.id} className="bg-white rounded-lg border border-[#E7E4D9] px-4 py-3 flex items-center justify-between">
            <span className="text-[14.5px] text-[#16302B]">{r.name}</span>
            <span className="text-[14.5px] font-medium text-[#16302B] tabular-nums">${fmtMoney(r.amt)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function DayStatusBanner({ students, dateStr, dow, label, isToday }) {
  const [dismissed, setDismissed] = useState(() => {
    try { return localStorage.getItem("dismissed-no-record-" + dateStr) === "1"; } catch (e) { return false; }
  });
  const recorded = students.filter((st) => getSessions(st).some((s) => s.date === dateStr));
  const scheduled = students.filter((st) => st.weekdays && st.weekdays.includes(dow));

  if (recorded.length > 0) {
    if (!isToday) return null; // only show a positive confirmation for today; yesterday just needs the warning (or nothing)
    return (
      <div className="mx-4 mt-2 mb-1 px-3.5 py-2.5 rounded-lg bg-[#0F6B5C]/10 text-[13px] text-[#0F6B5C] flex items-start gap-2">
        <IconCheck size={14} className="shrink-0 mt-0.5" />
        <span>{label}已記錄：{recorded.map((s) => s.name).join("、")}</span>
      </div>
    );
  }
  // no reminder at all if nobody was expected to have class that day (based on 固定上課星期)
  if (scheduled.length === 0) return null;
  if (dismissed) return null;
  return (
    <div className="mx-4 mt-2 mb-1 px-3.5 py-2.5 rounded-lg bg-[#C1533D]/10 text-[13px] text-[#C1533D] flex items-center justify-between gap-2 flex-wrap">
      <span className="flex items-center gap-2"><IconAlert size={14} className="shrink-0" />{label}{scheduled.map((s) => s.name).join("、")}應該有課，但還沒有紀錄</span>
      <button
        onClick={() => { try { localStorage.setItem("dismissed-no-record-" + dateStr, "1"); } catch (e) {} setDismissed(true); }}
        className="shrink-0 text-[11px] px-2.5 py-1 rounded-full border border-[#C1533D] font-medium"
      >
        確認沒問題
      </button>
    </div>
  );
}

// "no records for too long": interval = 7 ÷ weekly class days + 3 days buffer.
// Only for active students who have 固定上課星期 set and at least one record.
function StaleRecordBanner({ students }) {
  const [, force] = useState(0);
  const now = new Date(todayStr() + "T00:00:00");
  const items = [];
  students.forEach((st) => {
    if (st.status === "paused" || !st.weekdays || st.weekdays.length === 0) return;
    const sess = getSessions(st);
    if (sess.length === 0) return;
    const last = sess.reduce((m, s) => (s.date > m ? s.date : m), "0000-00-00");
    const days = Math.round((now - new Date(last + "T00:00:00")) / 86400000);
    const limit = 7 / st.weekdays.length + 3;
    if (days <= limit) return;
    let dismissed = false;
    try { dismissed = localStorage.getItem("dismissed-stale-" + st.id + "-" + last) === "1"; } catch (e) {}
    if (dismissed) return;
    items.push({ st, last, days });
  });
  if (items.length === 0) return null;
  return (
    <>
      {items.map(({ st, last, days }) => (
        <div key={st.id} className="mx-4 mt-2 mb-1 px-3.5 py-2.5 rounded-lg bg-[#C1833D]/10 text-[13px] text-[#C1833D] flex items-center justify-between gap-2 flex-wrap">
          <span className="flex items-center gap-2"><IconAlert size={14} className="shrink-0" />{st.name} 已 {days} 天沒有紀錄（最後一筆 {fmtDate(last)}）</span>
          <button
            onClick={() => { try { localStorage.setItem("dismissed-stale-" + st.id + "-" + last, "1"); } catch (e) {} force((n) => n + 1); }}
            className="shrink-0 text-[11px] px-2.5 py-1 rounded-full border border-[#C1833D] font-medium"
          >確認沒問題</button>
        </div>
      ))}
    </>
  );
}

function TodayStatusBanner({ students }) {
  const today = new Date();
  const todayStr_ = todayStr();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = localDateStr(yesterday);
  const twoAgo = new Date(today);
  twoAgo.setDate(twoAgo.getDate() - 2);
  const twoAgoStr = localDateStr(twoAgo);
  return (
    <>
      <DayStatusBanner students={students} dateStr={twoAgoStr} dow={twoAgo.getDay()} label="前天" isToday={false} />
      <DayStatusBanner students={students} dateStr={yesterdayStr} dow={yesterday.getDay()} label="昨天" isToday={false} />
      <DayStatusBanner students={students} dateStr={todayStr_} dow={today.getDay()} label="今日" isToday={true} />
      <StaleRecordBanner students={students} />
    </>
  );
}

function DueRemindersBanner({ students, onOpen }) {
  const items = [];
  students.forEach((st) => {
    if (st.viaPlatform) return;
    unpaidCycles(st).forEach(({ cycle, expectedNext, completedAt }) => {
      // shows immediately once the previous round completes, and stays visible every
      // time the app is opened until this round is marked notified or paid — no delay.
      items.push({ student: st, expectedNext, completedAt });
    });
  });
  if (items.length === 0) return null;
  return (
    <div className="mx-4 mt-2 mb-1 space-y-2">
      {items.map(({ student, expectedNext, completedAt }) => (
        <button key={student.id} onClick={() => onOpen(student.id)}
          className="w-full text-left bg-[#C1533D]/10 border border-[#C1533D]/30 rounded-lg px-3.5 py-2.5 flex items-center gap-2">
          <IconAlert size={14} className="text-[#C1533D] shrink-0" />
          <span className="text-[13px] text-[#C1533D]">
            <span className="font-medium">{student.name}</span> 已滿一輪尚未標記收費{expectedNext ? `，下次預計上課日 ${fmtDate(expectedNext)}` : `（第 ${fmtDate(completedAt)} 輪完成）`}
          </span>
        </button>
      ))}
    </div>
  );
}

function SettlementView({ students }) {
  const years = yearsWithData(students);
  const [year, setYear] = useState(years[0]);
  const rows = students.map((st) => ({ id: st.id, name: st.name, ...annualSummary(st, year) })).filter((r) => r.classCount > 0);
  const totalRefund = rows.reduce((sum, r) => sum + r.refund, 0);
  const totalRefundExcl = rows.reduce((sum, r) => sum + r.refundExcl, 0);
  return (
    <div className="px-4 pt-4 pb-10">
      <div className="flex items-center gap-2 mb-4 overflow-x-auto no-scrollbar">
        {years.map((y) => (
          <button key={y} onClick={() => setYear(y)} className={"shrink-0 px-3 py-1.5 rounded-full text-[13px] font-medium border " + (y === year ? "bg-[#16302B] text-white border-[#16302B]" : "bg-white text-[#16302B] border-[#DEDACB]")}>{y} 年</button>
        ))}
      </div>
      <div className="bg-[#16302B] rounded-2xl p-5 mb-5 text-white">
        <div className="text-[12px] text-[#B9D4CB] mb-1">{year} 年應退款總額</div>
        <div className="font-serif text-[32px] tabular-nums">${fmtMoney(totalRefund)}</div>
        <div className="text-[12px] text-[#B9D4CB] mt-1">全年請假（含長假）≤ 上課堂數 1/4 者，超額請假費用退還</div>
        {totalRefundExcl !== totalRefund && <div className="text-[12px] text-[#B9D4CB] mt-1">若不計長假：${fmtMoney(totalRefundExcl)}</div>}
      </div>
      <div className="space-y-2">
        {rows.length === 0 && <div className="text-center text-[#B9B6A8] text-[14px] py-10">這一年還沒有紀錄</div>}
        {rows.map((r) => (
          <div key={r.id} className="bg-white rounded-lg border border-[#E7E4D9] px-4 py-3">
            <div className="flex items-center justify-between mb-1">
              <span className="text-[14.5px] text-[#16302B] font-medium">{r.name}</span>
              <span className={"text-[11px] px-2 py-0.5 rounded-full font-medium " + (r.eligible || r.refund > 0 ? "bg-[#0F6B5C]/10 text-[#0F6B5C]" : r.eligibleExcl ? "bg-[#C1833D]/10 text-[#C1833D]" : "bg-[#B9B6A8]/15 text-[#8A8676]")}>
                {r.eligible ? "符合資格" : r.refund > 0 ? "老師請假抵銷" : r.eligibleExcl ? "視長假而定" : "不符合"}
              </span>
            </div>
            <div className="text-[12.5px] text-[#8A8676]">上課 {r.classCount} 堂 · 請假 {r.leaveCount} 次{r.longLeaveCount > 0 && <> · 長假 {r.longLeaveCount} 次</>}{r.teacherLeaveCount > 0 && <> · 老師請假 {r.teacherLeaveCount} 次</>} · 門檻 {r.threshold}{r.chargedCount > 0 && <> · 超額請假 {r.chargedCount} 次</>}</div>
            {r.longLeaveCount > 0 ? (
              <div className="mt-1.5 space-y-0.5 text-[12.5px] tabular-nums">
                <div className={r.eligible ? "text-[#0F6B5C] font-medium" : "text-[#8A8676]"}>計入長假（{r.leaveCount + r.longLeaveCount} 次）：{r.eligible ? `符合，退款 $${fmtMoney(r.refund)}` : "不符合"}</div>
                <div className={r.eligibleExcl ? "text-[#0F6B5C] font-medium" : "text-[#8A8676]"}>不計長假（{r.leaveCount} 次）：{r.eligibleExcl ? `符合，退款 $${fmtMoney(r.refundExcl)}` : "不符合"}</div>
              </div>
            ) : (
              r.refund > 0 && <div className="text-[13.5px] text-[#0F6B5C] font-medium tabular-nums mt-1">退款 ${fmtMoney(r.refund)}{!r.eligible && r.creditWaived > 0 && <span className="text-[11.5px] text-[#8A8676] font-normal">（老師請假抵銷 {r.creditWaived} 次超額請假）</span>}</div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- setup / sign-in screens ---------- */
function SetupScreen({ onSaveClientId }) {
  const [id, setId] = useState("");
  return (
    <div className="min-h-screen flex items-center justify-center px-6">
      <div className="max-w-sm w-full">
        <h1 className="font-serif text-[22px] text-[#16302B] mb-2">家教記事 · 設定</h1>
        <p className="text-[13.5px] text-[#8A8676] leading-relaxed mb-5">
          第一次使用需要貼上你自己的 Google API Client ID（設定步驟請參考說明文件）。這組 ID 只會存在你這台裝置的瀏覽器裡。
        </p>
        <input value={id} onChange={(e) => setId(e.target.value)} placeholder="貼上 Client ID（xxxx.apps.googleusercontent.com）"
          className="w-full border border-[#DEDACB] rounded-lg px-3 py-2.5 text-[14px] bg-white mb-3" />
        <button disabled={!id.trim()} onClick={() => onSaveClientId(id.trim())}
          className="w-full bg-[#16302B] disabled:bg-[#C9C6B8] text-white rounded-lg py-3 text-[14.5px] font-medium">儲存並繼續</button>
      </div>
    </div>
  );
}

function SignInScreen({ onSignIn, authError, onResetClientId }) {
  return (
    <div className="min-h-screen flex items-center justify-center px-6">
      <div className="max-w-sm w-full text-center">
        <IconCloud size={32} className="mx-auto mb-4 text-[#16302B]" />
        <h1 className="font-serif text-[20px] text-[#16302B] mb-2">家教記事</h1>
        <p className="text-[13.5px] text-[#8A8676] mb-6">登入 Google 帳號，資料會同步到你的 Google Drive。</p>
        <button onClick={onSignIn} className="w-full bg-[#16302B] text-white rounded-lg py-3 text-[14.5px] font-medium mb-3">使用 Google 帳號登入</button>
        {authError && <p className="text-[12.5px] text-[#C1533D] mb-3">{authError}</p>}
        <button onClick={onResetClientId} className="text-[12px] text-[#B9B6A8] underline">重新設定 Client ID</button>
      </div>
    </div>
  );
}

function StudentListView({ students, onOpen }) {
  const [subTab, setSubTab] = useState("regular");
  const [query, setQuery] = useState("");
  const [showArchived, setShowArchived] = useState(false);

  const byType = students.filter((st) => (subTab === "platform" ? st.viaPlatform : !st.viaPlatform));
  const activeOnes = byType.filter((st) => st.status !== "paused");
  const archivedOnes = byType.filter((st) => st.status === "paused");
  const pool = showArchived ? archivedOnes : activeOnes;
  const filtered = query.trim() ? pool.filter((st) => st.name.toLowerCase().includes(query.trim().toLowerCase())) : pool;
  const sorted = [...filtered].sort((a, b) => a.name.localeCompare(b.name, "zh-Hant"));
  const todayDow = new Date().getDay();
  const todayStudents = showArchived ? [] : sorted.filter((st) => st.weekdays && st.weekdays.includes(todayDow));
  const restStudents = showArchived ? sorted : sorted.filter((st) => !(st.weekdays && st.weekdays.includes(todayDow)));

  return (
    <div className="px-4 space-y-2.5">
      <div className="flex gap-2">
        <button onClick={() => { setSubTab("regular"); setShowArchived(false); }} className={"flex-1 py-2 rounded-lg text-[13px] font-medium border " + (subTab === "regular" ? "bg-[#16302B] text-white border-[#16302B]" : "bg-white text-[#16302B] border-[#DEDACB]")}>一般家教</button>
        <button onClick={() => { setSubTab("platform"); setShowArchived(false); }} className={"flex-1 py-2 rounded-lg text-[13px] font-medium border " + (subTab === "platform" ? "bg-[#16302B] text-white border-[#16302B]" : "bg-white text-[#16302B] border-[#DEDACB]")}>平台學生</button>
      </div>
      <input
        value={query}
        onChange={(e) => setQuery(e.target.value)}
        placeholder="搜尋學生姓名"
        className="w-full border border-[#DEDACB] rounded-lg px-3 py-2 text-[14px] bg-white focus:outline-none focus:ring-2 focus:ring-[#0F6B5C]/30"
      />
      {archivedOnes.length > 0 && (
        <button onClick={() => setShowArchived((v) => !v)} className="text-[12px] text-[#8A8676] underline">
          {showArchived ? "← 返回進行中名單" : `顯示已封存（${archivedOnes.length}）`}
        </button>
      )}
      {sorted.length === 0 && (
        <div className="text-center py-16 text-[#B9B6A8]"><IconUsers size={28} className="mx-auto mb-3 opacity-60" /><p className="text-[14px]">{query ? "找不到符合的學生" : "這裡還沒有學生"}</p></div>
      )}
      {todayStudents.map((st) => <StudentCard key={st.id} student={st} onOpen={onOpen} />)}
      {todayStudents.length > 0 && restStudents.length > 0 && (
        <div className="flex items-center gap-2 py-1">
          <div className="flex-1 h-px bg-[#E7E4D9]" />
          <span className="text-[11px] text-[#B9B6A8]">今天沒課</span>
          <div className="flex-1 h-px bg-[#E7E4D9]" />
        </div>
      )}
      {restStudents.map((st) => <StudentCard key={st.id} student={st} onOpen={onOpen} />)}
    </div>
  );
}

/* ---------- app root ---------- */
function App() {
  const drive = useDriveSync();
  const [students, setStudents] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("students");
  const [openId, setOpenId] = useState(null);
  const [showAddStudent, setShowAddStudent] = useState(false);
  const [syncError, setSyncError] = useState("");
  // undo: in-memory snapshots of the student list taken before each change (this session only)
  const studentsRef = useRef([]);
  const historyRef = useRef([]);
  const [histLen, setHistLen] = useState(0);
  const [toast, setToast] = useState("");
  const toastTimer = useRef(null);

  useEffect(() => {
    if (!drive.signedIn) return;
    (async () => {
      try {
        const data = await drive.loadData();
        studentsRef.current = data;
        setStudents(data);
      } catch (e) {
        setSyncError("讀取 Drive 資料失敗：" + e.message);
      } finally {
        setLoaded(true);
      }
    })();
  }, [drive.signedIn]); // eslint-disable-line

  const [shareBusy, setShareBusy] = useState(false);

  const persist = useCallback(async (next, opts) => {
    if (!opts || !opts.skipHistory) {
      historyRef.current.push(studentsRef.current);
      if (historyRef.current.length > 30) historyRef.current.shift();
      setHistLen(historyRef.current.length);
    }
    studentsRef.current = next;
    setStudents(next);
    try {
      await drive.saveData(next);
      setSyncError("");
      // keep any already-shared student's public file in sync
      for (const st of next) {
        if (st.publicFileId) {
          try { await drive.writeStudentPublicFile(st.publicFileId, { name: st.name, cycles: getCycles(st), classesPerCycle: st.classesPerCycle, weekdays: st.weekdays }); } catch (e) {}
        }
      }
    } catch (e) {
      setSyncError("儲存到 Drive 失敗，請確認網路後重試");
    }
  }, [drive]);

  const undo = useCallback(() => {
    const prev = historyRef.current.pop();
    setHistLen(historyRef.current.length);
    if (!prev) return;
    // keep share links that were created after the snapshot was taken
    const cur = studentsRef.current;
    const restored = prev.map((st) => {
      const now = cur.find((c) => c.id === st.id);
      return now && now.publicFileId && !st.publicFileId ? { ...st, publicFileId: now.publicFileId } : st;
    });
    persist(restored, { skipHistory: true });
    setToast("已復原上一個動作");
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2500);
  }, [persist]);

  const handleShare = useCallback(async (studentId) => {
    setShareBusy(true);
    try {
      const st = students.find((s) => s.id === studentId);
      const fileId = await drive.ensureStudentPublicFile(st);
      await drive.writeStudentPublicFile(fileId, { name: st.name, cycles: getCycles(st), classesPerCycle: st.classesPerCycle, weekdays: st.weekdays });
      await persist(students.map((s) => (s.id === studentId ? { ...s, publicFileId: fileId } : s)), { skipHistory: true });
    } catch (e) {
      setSyncError("建立分享連結失敗，請重試");
    } finally {
      setShareBusy(false);
    }
  }, [drive, students, persist]);

  if (!drive.clientId) {
    return <SetupScreen onSaveClientId={drive.setClientId} />;
  }
  if (!drive.signedIn) {
    return <SignInScreen onSignIn={drive.signIn} authError={drive.authError} onResetClientId={() => drive.setClientId("")} />;
  }
  if (!loaded) {
    return <div className="min-h-screen flex items-center justify-center text-[#8A8676] text-[14px]">同步中…</div>;
  }

  const openStudent = students.find((s) => s.id === openId) || null;

  return (
    <div className="min-h-screen bg-[#F7F8F3]">
      {openStudent ? (
        <div className="relative max-w-md mx-auto min-h-screen bg-[#F7F8F3]">
          <StudentDetail
            student={openStudent}
            onBack={() => setOpenId(null)}
            onAddSession={(date, type) => persist(students.map((s) => (s.id === openId ? addSessionToStudent(s, date, type) : s)))}
            onRemoveSession={(sessionId) => persist(students.map((s) => (s.id === openId ? removeSessionFromStudent(s, sessionId) : s)))}
            onDeleteStudent={() => { persist(students.filter((s) => s.id !== openId)); setOpenId(null); }}
            onEditRate={({ name, rate, rateEffectiveDate, hours, cycleLen, weekdays, email, freeLeaves, status, viaPlatform }) => persist(students.map((s) => {
              if (s.id !== openId) return s;
              const withRate = setStudentCycleLen(setStudentRate(s, rate, rateEffectiveDate), cycleLen, rateEffectiveDate);
              return { ...withRate, name, sessionHours: hours, weekdays, email, freeLeaves, status, viaPlatform };
            }))}
            onShare={() => handleShare(openId)}
            shareBusy={shareBusy}
            onSetPaid={(cycleId, paidDate) => persist(students.map((s) => (s.id === openId ? setCyclePaidDate(s, cycleId, paidDate) : s)))}
            onSetNotified={(cycleId, notifiedDate) => persist(students.map((s) => (s.id === openId ? setCycleNotifiedDate(s, cycleId, notifiedDate) : s)))}
          />
        </div>
      ) : (
        <div className="max-w-md mx-auto min-h-screen flex flex-col">
          <div className="px-4 pt-5 pb-2 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <h1 className="font-serif text-[22px] text-[#16302B]">家教記事</h1>
              <IconCloud size={14} className="text-[#0F6B5C]" />
            </div>
            {tab === "students" && (
              <button onClick={() => setShowAddStudent(true)} className="w-8 h-8 rounded-full bg-[#16302B] text-white flex items-center justify-center"><IconPlus size={17} /></button>
            )}
          </div>
          {syncError && <div className="mx-4 mb-2 text-[12px] text-[#C1533D] flex items-center gap-1"><IconAlert size={12} /> {syncError}</div>}
          <div className="flex-1">
            {tab === "students" ? (
              <div className="pt-2 pb-24">
                <TodayStatusBanner students={students} />
                <DueRemindersBanner students={students} onOpen={setOpenId} />
                <StudentListView students={students} onOpen={setOpenId} />
              </div>
            ) : tab === "income" ? <IncomeView students={students} /> : <SettlementView students={students} />}
          </div>
          <div className="sticky bottom-0 bg-[#F7F8F3]/95 backdrop-blur border-t border-[#E7E4D9] px-6 py-2.5 flex justify-around max-w-md mx-auto w-full">
            <button onClick={() => setTab("students")} className={"flex flex-col items-center gap-0.5 px-4 py-1 " + (tab === "students" ? "text-[#16302B]" : "text-[#B9B6A8]")}><IconUsers size={19} /><span className="text-[11px]">學生</span></button>
            <button onClick={() => setTab("income")} className={"flex flex-col items-center gap-0.5 px-4 py-1 " + (tab === "income" ? "text-[#16302B]" : "text-[#B9B6A8]")}><IconWallet size={19} /><span className="text-[11px]">收入</span></button>
            <button onClick={() => setTab("settlement")} className={"flex flex-col items-center gap-0.5 px-4 py-1 " + (tab === "settlement" ? "text-[#16302B]" : "text-[#B9B6A8]")}><IconCalendarCheck size={19} /><span className="text-[11px]">年度結算</span></button>
          </div>
        </div>
      )}
      {histLen > 0 && (
        <button onClick={undo} className="fixed left-4 bottom-20 z-40 bg-[#16302B] text-white rounded-full pl-3 pr-4 py-2 text-[13px] font-medium shadow-lg flex items-center gap-1.5">
          <span className="text-[16px] leading-none">↶</span> 復原
        </button>
      )}
      {toast && <div className="fixed left-1/2 -translate-x-1/2 bottom-32 z-40 bg-[#16302B] text-white text-[13px] rounded-full px-4 py-2 shadow-lg">{toast}</div>}
      {showAddStudent && (
        <AddStudentSheet onClose={() => setShowAddStudent(false)} onSave={(name, rate, hours, cycleLen, viaPlatform, weekdays, email, freeLeaves) => { persist([...students, newStudent(name, rate, hours, cycleLen, viaPlatform, weekdays, email, freeLeaves)]); setShowAddStudent(false); }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
