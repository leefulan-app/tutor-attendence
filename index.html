const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------- small inline icons (no external icon dependency) ---------- */

);
const IconPlus = (p) => <Icon {...p} path="M12 5v14M5 12h14" />;

const IconCloud = (p) => <Icon {...p} path="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z" />;
const IconLink = (p) => <Icon {...p} path="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" />;
const IconMail = (p) => <Icon {...p} path="M4 4h16v16H4V4zm0 0l8 8 8-8" />;
const IconCalendarCheck = (p) => <Icon {...p} path="M8 2v4M16 2v4M3 10h18M3 6h18v14a1 1 0 01-1 1H4a1 1 0 01-1-1V6zM9 16l2 2 4-4" />;

/* ---------- domain logic ---------- */
const todayStr = () => new Date().toISOString().slice(0, 10);
const uid = () => Math.random().toString(36).slice(2, 10);

// income "months" run from the 5th of a month to the 4th of the next month.
// a date on the 1st-4th belongs to the PREVIOUS calendar month's period.
function incomeMonthKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  let y = d.getFullYear(), m = d.getMonth();
  if (d.getDate() < 5) { m -= 1; if (m < 0) { m = 11; y -= 1; } }
  return `${y}-${String(m + 1).padStart(2, "0")}`;
}
const monthLabel = (ym) => {
  const [y, m] = ym.split("-").map((v) => parseInt(v, 10));
  const endM = m === 12 ? 1 : m + 1;
  const endY = m === 12 ? y + 1 : y;
  return `${y}/${m}/5 – ${endY}/${endM}/4`;
};
const monthLabelShort = (ym) => {
  const [y, m] = ym.split("-").map((v) => parseInt(v, 10));
  const endM = m === 12 ? 1 : m + 1;
  return `${m}/5-${endM}/4`;
};
const fmtDate = (d) => { const dt = new Date(d + "T00:00:00"); return `${dt.getMonth() + 1}/${dt.getDate()}`; };
const fmtMoney = (n) => Math.round(n).toLocaleString("zh-TW");

// per-class income: if the hourly rate is under 100, treat it as a per-minute
// rate and multiply by 30; otherwise use the normal rate × session length.
function perClassAmount(student) {
  return student.hourlyRate < 100 ? student.hourlyRate * 30 : student.hourlyRate * student.sessionHours;
}

function newStudent(name, hourlyRate, sessionHours, classesPerCycle, viaPlatform, weekdays, email, freeLeaves) {
  return {
    id: uid(), name, hourlyRate, sessionHours,
    classesPerCycle: classesPerCycle || 10,
    viaPlatform: !!viaPlatform,
    weekdays: weekdays || [],
    email: email || "",
    freeLeaves: (freeLeaves == null || freeLeaves === "") ? 2 : freeLeaves,
    sessions: [],
    cyclePayments: {},
  };
}

// --- backward-compat readers: old saved data may still have a nested `cycles` array
// instead of a flat `sessions` list. These let every part of the app read either shape
// transparently; a student is fully migrated to the new shape the next time they're edited.
function getSessions(student) {
  if (Array.isArray(student.sessions)) return student.sessions;
  if (Array.isArray(student.cycles)) return student.cycles.flatMap((c) => c.sessions || []);
  return [];
}
function getCyclePayments(student) {
  if (student.cyclePayments) return student.cyclePayments;
  if (Array.isArray(student.cycles)) {
    const map = {};
    student.cycles.forEach((c, i) => { if (c.paidDate) map[i] = c.paidDate; });
    return map;
  }
  return {};
}
// a payment entry may be a legacy plain date string (paidDate only), or the
// newer { paidDate, notifiedDate } shape
function normalizePaymentEntry(entry) {
  if (!entry) return { paidDate: null, notifiedDate: null };
  if (typeof entry === "string") return { paidDate: entry, notifiedDate: null };
  return { paidDate: entry.paidDate || null, notifiedDate: entry.notifiedDate || null };
}

// Derive cycles fresh from the flat, chronologically-sorted session list every time.
// This is what makes backfilled (late-entered) records land in the correct round
// instead of always spilling into whichever round is currently open.
function getCycles(student) {
  const total = student.classesPerCycle || 10;
  const payments = getCyclePayments(student);
  const sorted = [...getSessions(student)].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1)));
  const cycles = [];
  let current = { id: "cycle-0", sessions: [], completedAt: null };
  let n = 0, idx = 0;
  sorted.forEach((s) => {
    current.sessions.push(s);
    if (s.type === "class") {
      n++;
      if (n >= total) {
        current.completedAt = s.date;
        cycles.push(current);
        idx++;
        current = { id: "cycle-" + idx, sessions: [], completedAt: null };
        n = 0;
      }
    }
  });
  cycles.push(current);
  return cycles.map((c, i) => ({ ...c, ...normalizePaymentEntry(payments[i]) }));
}

const classCount = (cycle) => cycle.sessions.filter((s) => s.type === "class").length;
const leaveCount = (cycle) => cycle.sessions.filter((s) => s.type === "leave").length;
const WEEKDAY_LABELS = ["日", "一", "二", "三", "四", "五", "六"];
const weekdaysLabel = (weekdays) => (weekdays && weekdays.length ? [...weekdays].sort((a, b) => WEEKDAY_DISPLAY_ORDER.indexOf(a) - WEEKDAY_DISPLAY_ORDER.indexOf(b)).map((d) => WEEKDAY_LABELS[d]).join("、") : "");

// find the next date (after afterDateStr) that falls on one of the given weekdays
function nextExpectedDate(afterDateStr, weekdays) {
  if (!weekdays || weekdays.length === 0) return null;
  let d = new Date(afterDateStr + "T00:00:00");
  d.setDate(d.getDate() + 1);
  for (let i = 0; i < 14; i++) {
    if (weekdays.includes(d.getDay())) return d.toISOString().slice(0, 10);
    d.setDate(d.getDate() + 1);
  }
  return null;
}

// Predict the payment deadline for the CURRENT (in-progress) cycle: project forward
// from its most recent recorded date through the student's weekday pattern, counting
// off the remaining classes needed — the deadline is the class-day right after that
// (i.e. the first day of the next cycle). Because this starts counting from the most
// recently recorded session (class OR leave), a newly-recorded leave automatically
// pushes the date later, since it consumes a weekday slot without counting as a class.
function predictedCycleDeadline(cycle, weekdays, classesPerCycle) {
  if (!weekdays || weekdays.length === 0) return null;
  const remaining = classesPerCycle - classCount(cycle);
  if (remaining <= 0) return null;
  const sorted = [...cycle.sessions].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const fromDate = sorted.length ? sorted[sorted.length - 1].date : todayStr();
  let d = new Date(fromDate + "T00:00:00");
  let count = 0;
  for (let i = 0; i < 120; i++) {
    d.setDate(d.getDate() + 1);
    if (weekdays.includes(d.getDay())) {
      count++;
      if (count === remaining + 1) return d.toISOString().slice(0, 10);
    }
  }
  return null;
}

// unpaid upcoming cycles for a student: for each completed cycle, check whether
// the FOLLOWING cycle (the one it's prepaying for) has been marked paid
function unpaidCycles(student) {
  const cycles = getCycles(student);
  const result = [];
  for (let i = 0; i < cycles.length - 1; i++) {
    const c = cycles[i];
    const next = cycles[i + 1];
    if (c.completedAt && !next.paidDate) {
      result.push({ cycle: next, expectedNext: nextExpectedDate(c.completedAt, student.weekdays) });
    }
  }
  return result;
}

function addSessionToStudent(student, date, type) {
  const sessions = [...getSessions(student), { id: uid(), date, type }];
  const cyclePayments = getCyclePayments(student);
  const { cycles, ...rest } = student;
  return { ...rest, sessions, cyclePayments };
}

function setCyclePaidDate(student, cycleId, paidDate) {
  const idx = parseInt(String(cycleId).replace("cycle-", ""), 10);
  const cyclePayments = { ...getCyclePayments(student) };
  const cur = normalizePaymentEntry(cyclePayments[idx]);
  const next = { ...cur, paidDate };
  if (!next.paidDate && !next.notifiedDate) delete cyclePayments[idx]; else cyclePayments[idx] = next;
  const { cycles, ...rest } = student;
  return { ...rest, sessions: getSessions(student), cyclePayments };
}

function setCycleNotifiedDate(student, cycleId, notifiedDate) {
  const idx = parseInt(String(cycleId).replace("cycle-", ""), 10);
  const cyclePayments = { ...getCyclePayments(student) };
  const cur = normalizePaymentEntry(cyclePayments[idx]);
  const next = { ...cur, notifiedDate };
  if (!next.paidDate && !next.notifiedDate) delete cyclePayments[idx]; else cyclePayments[idx] = next;
  const { cycles, ...rest } = student;
  return { ...rest, sessions: getSessions(student), cyclePayments };
}

function removeSessionFromStudent(student, sessionId) {
  const sessions = getSessions(student).filter((s) => s.id !== sessionId);
  const cyclePayments = getCyclePayments(student);
  const { cycles, ...rest } = student;
  return { ...rest, sessions, cyclePayments };
}

// leaves beyond the free allowance (in date order) within a cycle are "charged" as if a class happened
function chargedLeaveIds(cycle, freeLeaves) {
  const n = freeLeaves == null ? 2 : freeLeaves;
  const leaves = cycle.sessions.filter((s) => s.type === "leave").sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const charged = new Set();
  leaves.forEach((s, idx) => { if (idx >= n) charged.add(s.id); });
  return charged;
}

function monthlyIncomeByMonth(students) {
  const map = {};
  students.forEach((st) => {
    getCycles(st).forEach((c) => {
      const charged = chargedLeaveIds(c, st.freeLeaves);
      c.sessions.forEach((s) => {
        const counts = s.type === "class" || (s.type === "leave" && charged.has(s.id));
        if (!counts) return;
        const ym = incomeMonthKey(s.date);
        if (!map[ym]) map[ym] = { total: 0, byStudent: {} };
        const amt = perClassAmount(st);
        map[ym].total += amt;
        map[ym].byStudent[st.id] = (map[ym].byStudent[st.id] || 0) + amt;
      });
    });
  });
  return map;
}

// per calendar year: actual class count, leave count, refund eligibility & amount
function annualSummary(student, year) {
  let classCount = 0, leaveCount = 0, chargedAmount = 0, chargedCount = 0;
  getCycles(student).forEach((cycle) => {
    const charged = chargedLeaveIds(cycle, student.freeLeaves);
    cycle.sessions.forEach((s) => {
      if (parseInt(s.date.slice(0, 4), 10) !== year) return;
      if (s.type === "class") classCount++;
      else {
        leaveCount++;
        if (charged.has(s.id)) { chargedAmount += student.hourlyRate * student.sessionHours; chargedCount++; }
      }
    });
  });
  const threshold = Math.ceil(classCount / 4);
  const eligible = classCount > 0 && leaveCount <= threshold;
  return { year, classCount, leaveCount, threshold, eligible, refund: eligible ? chargedAmount : 0, chargedAmount, chargedCount };
}

function yearsWithData(students) {
  const set = new Set();
  students.forEach((st) => getSessions(st).forEach((s) => set.add(parseInt(s.date.slice(0, 4), 10))));
  set.add(new Date().getFullYear());
  return Array.from(set).sort((a, b) => b - a);
}

/* ---------- Google Drive sync layer ---------- */
const CLIENT_ID_KEY = "tutor_drive_client_id";
const DRIVE_FILE_NAME = "tutor-ledger-data.json";
const SCOPES = "https://www.googleapis.com/auth/drive.file";

function useDriveSync() {
  const [clientId, setClientIdState] = useState(localStorage.getItem(CLIENT_ID_KEY) || "");
  const [signedIn, setSignedIn] = useState(false);
  const [authError, setAuthError] = useState("");
  const [fileId, setFileId] = useState(null);
  const tokenRef = useRef(null);
  const tokenClientRef = useRef(null);

  const setClientId = (id) => {
    localStorage.setItem(CLIENT_ID_KEY, id);
    setClientIdState(id);
  };

  const ensureTokenClient = useCallback(() => {
    if (!window.google || !clientId) return null;
    if (!tokenClientRef.current) {
      tokenClientRef.current = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: SCOPES,
        callback: () => {},
      });
    }
    return tokenClientRef.current;
  }, [clientId]);

  const signIn = useCallback(() => {
    setAuthError("");
    const tc = ensureTokenClient();
    if (!tc) { setAuthError("尚未設定 Client ID"); return; }
    tc.callback = (resp) => {
      if (resp.error) { setAuthError("登入失敗：" + resp.error); return; }
      tokenRef.current = resp.access_token;
      setSignedIn(true);
    };
    tc.requestAccessToken({ prompt: "" });
  }, [ensureTokenClient]);

  const authedFetch = useCallback(async (url, opts = {}) => {
    const res = await fetch(url, {
      ...opts,
      headers: { ...(opts.headers || {}), Authorization: `Bearer ${tokenRef.current}` },
    });
    if (res.status === 401) throw new Error("授權過期，請重新登入");
    return res;
  }, []);

  const findOrCreateFile = useCallback(async () => {
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const res = await authedFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
    const data = await res.json();
    if (data.files && data.files.length > 0) return data.files[0].id;
    const createRes = await authedFetch("https://www.googleapis.com/drive/v3/files", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: "application/json" }),
    });
    const created = await createRes.json();
    await authedFetch(`https://www.googleapis.com/upload/drive/v3/files/${created.id}?uploadType=media`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ students: [] }),
    });
    return created.id;
  }, [authedFetch]);

  const loadData = useCallback(async () => {
    const id = fileId || (await findOrCreateFile());
    if (!fileId) setFileId(id);
    const res = await authedFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    const json = await res.json();
    return Array.isArray(json.students) ? json.students : [];
  }, [fileId, findOrCreateFile, authedFetch]);

  const saveData = useCallback(async (students) => {
    const id = fileId || (await findOrCreateFile());
    if (!fileId) setFileId(id);
    await authedFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ students }),
    });
  }, [fileId, findOrCreateFile, authedFetch]);

  const ensureStudentPublicFile = useCallback(async (student) => {
    const name = `student-public-${student.id}.json`;
    const q = encodeURIComponent(`name='${name}' and trashed=false`);
    const res = await authedFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
    const data = await res.json();
    let id;
    if (data.files && data.files.length > 0) {
      id = data.files[0].id;
    } else {
      const createRes = await authedFetch("https://www.googleapis.com/drive/v3/files", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, mimeType: "application/json" }),
      });
      const created = await createRes.json();
      id = created.id;
      await authedFetch(`https://www.googleapis.com/drive/v3/files/${id}/permissions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: "reader", type: "anyone" }),
      });
    }
    return id;
  }, [authedFetch]);

  const writeStudentPublicFile = useCallback(async (fileId, payload) => {
    await authedFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  }, [authedFetch]);

  return { clientId, setClientId, signedIn, authError, signIn, loadData, saveData, ensureStudentPublicFile, writeStudentPublicFile };
}

/* ---------- shared small components ---------- */
function Tally({ cycle, total }) {
  const n = total || 10;
  const classes = cycle.sessions.filter((s) => s.type === "class");
  const leaves = cycle.sessions.filter((s) => s.type === "leave");
  const marks = Array.from({ length: n }, (_, i) => (classes[i] ? "class" : "empty"));
  const dotWidth = n > 14 ? "4px" : "7px";
  return (
    <div className="flex items-center gap-2 flex-wrap">
      <div className="flex gap-[3px] flex-wrap">
        {marks.map((m, i) => (
          <span key={i} style={{ width: dotWidth }} className={"block h-[18px] rounded-[1px] " + (m === "class" ? "bg-[#0F6B5C]" : "bg-[#E4E1D6]")} />
        ))}
      </div>
      {leaves.length > 0 && <span className="text-[11px] text-[#C1833D] font-medium tabular-nums">請假 {leaves.length}</span>}
    </div>
  );
}

function StudentCard({ student, onOpen }) {
  const cycles = getCycles(student);
  const cur = cycles[cycles.length - 1];
  const cc = classCount(cur), lc = leaveCount(cur);
  return (
    <button onClick={() => onOpen(student.id)}
      className="w-full text-left bg-white rounded-xl border border-[#E7E4D9] px-4 py-3.5 flex items-center justify-between gap-3 active:scale-[0.99] transition-transform">
      <div className="min-w-0 flex-1">
        <div className="flex items-baseline gap-2">
          <span className="font-serif text-[17px] text-[#16302B] truncate">{student.name}</span>
          <span className="text-[12px] text-[#8A8676] tabular-nums shrink-0">${fmtMoney(student.hourlyRate)}/session</span>
          {student.viaPlatform && <span className="text-[10px] px-1.5 py-0.5 rounded bg-[#8A8676]/10 text-[#8A8676] shrink-0">平台</span>}
        </div>
        <div className="mt-2"><Tally cycle={cur} total={student.classesPerCycle} /></div>
        {lc > (student.freeLeaves == null ? 2 : student.freeLeaves) && (
          <div className="mt-1.5 flex items-center gap-1 text-[11px] text-[#C1533D]">
            <IconAlert size={12} /><span>本輪請假已超過 {student.freeLeaves == null ? 2 : student.freeLeaves} 次</span>
          </div>
        )}
      </div>
      <div className="flex flex-col items-end gap-1 shrink-0">
        <span className="text-[13px] font-medium text-[#16302B] tabular-nums">{cc}/{student.classesPerCycle || 10}</span>
        <IconChevronRight size={16} className="text-[#B9B6A8]" />
      </div>
    </button>
  );
}

function fmtDateMD(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}
function fmtDateEn(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[d.getMonth()]} ${d.getDate()}`;
}
function PaidStatusControl({ cycle, onSetPaidDate, onSetNotifiedDate }) {
  const [editing, setEditing] = useState(false);
  const stage = cycle.paidDate ? "paid" : cycle.notifiedDate ? "notified" : "none";
  const [dateVal, setDateVal] = useState(todayStr());

  const stageMeta = {
    none: { label: "尚未通知", style: "bg-[#8A8676]/10 text-[#8A8676]" },
    notified: { label: "已通知", style: "bg-[#C1833D]/10 text-[#C1833D]" },
    paid: { label: "✓ 已收費", style: "bg-[#0F6B5C]/10 text-[#0F6B5C]" },
  };
  const meta = stageMeta[stage];
  const displayDate = stage === "paid" ? cycle.paidDate : stage === "notified" ? cycle.notifiedDate : null;

  if (!editing) {
    return (
      <button onClick={() => { setDateVal(todayStr()); setEditing(true); }}
        className={"text-[11.5px] px-2 py-1 rounded-full font-medium " + meta.style}>
        {meta.label}{displayDate ? ` ${fmtDate(displayDate)}` : ""}（點擊{stage === "none" ? "標記" : "更新"}）
      </button>
    );
  }

  return (
    <div className="flex items-center gap-1.5 flex-wrap">
      <input type="date" value={dateVal} onChange={(e) => setDateVal(e.target.value)}
        className="text-[12px] border border-[#DEDACB] rounded px-1.5 py-1 bg-white" />
      {stage === "none" && (
        <button onClick={() => { onSetNotifiedDate(dateVal); setEditing(false); }} className="text-[11px] text-[#C1833D] font-medium px-1.5 py-1">標記已通知</button>
      )}
      {stage === "notified" && (
        <>
          <button onClick={() => { onSetNotifiedDate(dateVal); setEditing(false); }} className="text-[11px] text-[#C1833D] font-medium px-1.5 py-1">改通知日</button>
          <button onClick={() => { onSetPaidDate(dateVal); setEditing(false); }} className="text-[11px] text-[#0F6B5C] font-medium px-1.5 py-1">標記已收費</button>
        </>
      )}
      {stage === "paid" && (
        <>
          <button onClick={() => { onSetPaidDate(dateVal); setEditing(false); }} className="text-[11px] text-[#0F6B5C] font-medium px-1.5 py-1">改收費日</button>

        </>
      )}
      <button onClick={() => setEditing(false)} className="text-[11px] text-[#B9B6A8] px-1.5 py-1">取消</button>
    </div>
  );
}

function buildPaymentMailto(student, prevCompletedDate) {
  const total = student.classesPerCycle || 10;
  const dateZh = fmtDateMD(prevCompletedDate);
  const dateEn = fmtDateEn(prevCompletedDate);
  const subject = `${student.name} 課程費用通知 / Payment Reminder`;
  const body =
    `嗨！${student.name}，我們在${dateZh}上完了${total}堂課的最後一節，麻煩你下次上課前轉帳，謝謝！\n\n` +
    `----------\n\n` +
    `Hi ${student.name}! We just finished the last class of this set of ${total} lessons on ${dateEn}. Please transfer the payment before our next class. Thank you!`;
  return `mailto:${encodeURIComponent(student.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

const WEEKDAY_DISPLAY_ORDER = [1, 2, 3, 4, 5, 6, 0]; // Mon..Sat, Sun last
function WeekdayPicker({ value, onChange }) {
  const toggle = (d) => {
    if (value.includes(d)) onChange(value.filter((x) => x !== d));
    else onChange([...value, d]);
  };
  return (
    <div className="flex gap-1.5">
      {WEEKDAY_DISPLAY_ORDER.map((d) => (
        <button key={d} type="button" onClick={() => toggle(d)}
          className={"w-8 h-8 rounded-full text-[13px] font-medium border " + (value.includes(d) ? "bg-[#16302B] text-white border-[#16302B]" : "bg-white text-[#16302B] border-[#DEDACB]")}>

        </button>
      ))}
    </div>
  );
}

            if (!student.viaPlatform) {
              let justCompletedIdx = -1;
              for (let i = 0; i < after.length; i++) {
                const wasCompleted = before[i] && before[i].completedAt;
                if (after[i].completedAt && !wasCompleted) { justCompletedIdx = i; break; }

            <div className="flex gap-2">
              <button onClick={() => setPaidPrompt(null)} className="flex-1 py-2.5 rounded-lg border border-[#DEDACB] text-[14px] text-[#16302B]">還沒，稍後標記</button>
              <button onClick={() => { onSetPaid(paidPrompt, todayStr()); setPaidPrompt(null); }} className="flex-1 py-2.5 rounded-lg bg-[#0F6B5C] text-white text-[14px]">已收費（今天）</button>
            </div>
          </div>
        </div>
      )}
      {confirmDelete && (
        <div className="fixed inset-0 bg-black/30 flex items-center justify-center z-50 px-6">
          <div className="bg-white rounded-xl p-5 w-full max-w-xs">
            <p className="text-[14.5px] text-[#16302B] mb-4">確定要刪除「{student.name}」嗎？所有紀錄將一併移除，無法復原。</p>
            <div className="flex gap-2">
              <button onClick={() => setConfirmDelete(false)} className="flex-1 py-2.5 rounded-lg border border-[#DEDACB] text-[14px] text-[#16302B]">取消</button>
              <button onClick={onDeleteStudent} className="flex-1 py-2.5 rounded-lg bg-[#C1533D] text-white text-[14px]">刪除</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function IncomeView({ students }) {
  const incomeMap = useMemo(() => monthlyIncomeByMonth(students), [students]);
  const months = useMemo(() => { const s = new Set(Object.keys(incomeMap)); s.add(incomeMonthKey(todayStr())); return Array.from(s).sort().reverse(); }, [incomeMap]);
  const [selected, setSelected] = useState(months[0]);
  useEffect(() => { if (!months.includes(selected)) setSelected(months[0]); }, [months]); // eslint-disable-line
  const data = incomeMap[selected] || { total: 0, byStudent: {} };
  const rows = students.filter((st) => data.byStudent[st.id]).map((st) => ({ name: st.name, amt: data.byStudent[st.id] })).sort((a, b) => b.amt - a.amt);
  return (
    <div className="px-4 pt-4 pb-10">
      <div className="flex items-center gap-2 mb-4 overflow-x-auto no-scrollbar">
        {months.map((m) => (
          <button key={m} onClick={() => setSelected(m)} className={"shrink-0 px-3 py-1.5 rounded-full text-[13px] font-medium border " + (m === selected ? "bg-[#16302B] text-white border-[#16302B]" : "bg-white text-[#16302B] border-[#DEDACB]")}>{monthLabelShort(m)}</button>
        ))}
      </div>
      <div className="bg-[#16302B] rounded-2xl p-5 mb-5 text-white">
        <div className="text-[12px] text-[#B9D4CB] mb-1">{monthLabel(selected)}教學收入</div>
        <div className="font-serif text-[32px] tabular-nums">${fmtMoney(data.total)}</div>
        <div className="text-[12px] text-[#B9D4CB] mt-1">依實際上課堂數 × 時薪計算</div>
      </div>
      <div className="space-y-2">
        {rows.length === 0 && <div className="text-center text-[#B9B6A8] text-[14px] py-10">這個月還沒有上課紀錄</div>}
        {rows.map((r) => (
          <div key={r.name} className="bg-white rounded-lg border border-[#E7E4D9] px-4 py-3 flex items-center justify-between">
            <span className="text-[14.5px] text-[#16302B]">{r.name}</span>
            <span className="text-[14.5px] font-medium text-[#16302B] tabular-nums">${fmtMoney(r.amt)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function DueRemindersBanner({ students, onOpen }) {
  const today = todayStr();
  const items = [];
  students.forEach((st) => {
    if (st.viaPlatform) return;
    unpaidCycles(st).forEach(({ cycle, expectedNext }) => {
      if (!expectedNext) return;
      const remindFrom = new Date(expectedNext + "T00:00:00");
      remindFrom.setDate(remindFrom.getDate() - 1);
      const remindFromStr = remindFrom.toISOString().slice(0, 10);
      if (today >= remindFromStr) items.push({ student: st, expectedNext });
    });
  });
  if (items.length === 0) return null;
  return (
    <div className="mx-4 mt-2 mb-1 space-y-2">
      {items.map(({ student, expectedNext }) => (
        <button key={student.id} onClick={() => onOpen(student.id)}
          className="w-full text-left bg-[#C1533D]/10 border border-[#C1533D]/30 rounded-lg px-3.5 py-2.5 flex items-center gap-2">
          <IconAlert size={14} className="text-[#C1533D] shrink-0" />
          <span className="text-[13px] text-[#C1533D]">
            <span className="font-medium">{student.name}</span> 已滿一輪尚未標記收費，下次預計上課日 {fmtDate(expectedNext)}
          </span>
        </button>
      ))}
    </div>
  );
}

function SettlementView({ students }) {
  const years = yearsWithData(students);
  const [year, setYear] = useState(years[0]);
  const rows = students.map((st) => ({ name: st.name, ...annualSummary(st, year) })).filter((r) => r.classCount > 0);
  const totalRefund = rows.reduce((sum, r) => sum + r.refund, 0);
  return (
    <div className="px-4 pt-4 pb-10">
      <div className="flex items-center gap-2 mb-4 overflow-x-auto no-scrollbar">
        {years.map((y) => (
          <button key={y} onClick={() => setYear(y)} className={"shrink-0 px-3 py-1.5 rounded-full text-[13px] font-medium border " + (y === year ? "bg-[#16302B] text-white border-[#16302B]" : "bg-white text-[#16302B] border-[#DEDACB]")}>{y} 年</button>
        ))}
      </div>
      <div className="bg-[#16302B] rounded-2xl p-5 mb-5 text-white">
        <div className="text-[12px] text-[#B9D4CB] mb-1">{year} 年應退款總額</div>
        <div className="font-serif text-[32px] tabular-nums">${fmtMoney(totalRefund)}</div>
        <div className="text-[12px] text-[#B9D4CB] mt-1">全年請假 ≤ 上課堂數 1/4 者，超額請假費用退還</div>
      </div>
      <div className="space-y-2">
        {rows.length === 0 && <div className="text-center text-[#B9B6A8] text-[14px] py-10">這一年還沒有紀錄</div>}
        {rows.map((r) => (
          <div key={r.name} className="bg-white rounded-lg border border-[#E7E4D9] px-4 py-3">
            <div className="flex items-center justify-between mb-1">
              <span className="text-[14.5px] text-[#16302B] font-medium">{r.name}</span>
              <span className={"text-[11px] px-2 py-0.5 rounded-full font-medium " + (r.eligible ? "bg-[#0F6B5C]/10 text-[#0F6B5C]" : "bg-[#B9B6A8]/15 text-[#8A8676]")}>
                {r.eligible ? "符合資格" : "不符合"}
              </span>
            </div>
            <div className="text-[12.5px] text-[#8A8676]">上課 {r.classCount} 堂 · 請假 {r.leaveCount} 次 · 門檻 {r.threshold}{r.chargedCount > 0 && <> · 超額請假 {r.chargedCount} 次</>}</div>
            {r.eligible && <div className="text-[13.5px] text-[#0F6B5C] font-medium tabular-nums mt-1">退款 ${fmtMoney(r.refund)}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- setup / sign-in screens ---------- */
function SetupScreen({ onSaveClientId }) {
  const [id, setId] = useState("");
  return (
    <div className="min-h-screen flex items-center justify-center px-6">
      <div className="max-w-sm w-full">
        <h1 className="font-serif text-[22px] text-[#16302B] mb-2">家教記事 · 設定</h1>
        <p className="text-[13.5px] text-[#8A8676] leading-relaxed mb-5">
          第一次使用需要貼上你自己的 Google API Client ID（設定步驟請參考說明文件）。這組 ID 只會存在你這台裝置的瀏覽器裡。
        </p>
        <input value={id} onChange={(e) => setId(e.target.value)} placeholder="貼上 Client ID（xxxx.apps.googleusercontent.com）"
          className="w-full border border-[#DEDACB] rounded-lg px-3 py-2.5 text-[14px] bg-white mb-3" />
        <button disabled={!id.trim()} onClick={() => onSaveClientId(id.trim())}
          className="w-full bg-[#16302B] disabled:bg-[#C9C6B8] text-white rounded-lg py-3 text-[14.5px] font-medium">儲存並繼續</button>
      </div>
    </div>
  );
}

function SignInScreen({ onSignIn, authError, onResetClientId }) {
  return (
    <div className="min-h-screen flex items-center justify-center px-6">
      <div className="max-w-sm w-full text-center">
        <IconCloud size={32} className="mx-auto mb-4 text-[#16302B]" />
        <h1 className="font-serif text-[20px] text-[#16302B] mb-2">家教記事</h1>
        <p className="text-[13.5px] text-[#8A8676] mb-6">登入 Google 帳號，資料會同步到你的 Google Drive。</p>
        <button onClick={onSignIn} className="w-full bg-[#16302B] text-white rounded-lg py-3 text-[14.5px] font-medium mb-3">使用 Google 帳號登入</button>
        {authError && <p className="text-[12.5px] text-[#C1533D] mb-3">{authError}</p>}
        <button onClick={onResetClientId} className="text-[12px] text-[#B9B6A8] underline">重新設定 Client ID</button>
      </div>
    </div>
  );
}

/* ---------- app root ---------- */
function App() {
  const drive = useDriveSync();
  const [students, setStudents] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("students");
  const [openId, setOpenId] = useState(null);
  const [showAddStudent, setShowAddStudent] = useState(false);
  const [syncError, setSyncError] = useState("");

  useEffect(() => {
    if (!drive.signedIn) return;
    (async () => {
      try {
        const data = await drive.loadData();
        setStudents(data);
      } catch (e) {
        setSyncError("讀取 Drive 資料失敗：" + e.message);
      } finally {
        setLoaded(true);
      }
    })();
  }, [drive.signedIn]); // eslint-disable-line

  const [shareBusy, setShareBusy] = useState(false);

  const persist = useCallback(async (next) => {
    setStudents(next);
    try {
      await drive.saveData(next);
      setSyncError("");
      // keep any already-shared student's public file in sync
      for (const st of next) {
        if (st.publicFileId) {
          try { await drive.writeStudentPublicFile(st.publicFileId, { name: st.name, cycles: getCycles(st), classesPerCycle: st.classesPerCycle, weekdays: st.weekdays }); } catch (e) {}
        }
      }
    } catch (e) {
      setSyncError("儲存到 Drive 失敗，請確認網路後重試");
    }
  }, [drive]);

  const handleShare = useCallback(async (studentId) => {
    setShareBusy(true);
    try {
      const st = students.find((s) => s.id === studentId);
      const fileId = await drive.ensureStudentPublicFile(st);
      await drive.writeStudentPublicFile(fileId, { name: st.name, cycles: getCycles(st), classesPerCycle: st.classesPerCycle, weekdays: st.weekdays });
      await persist(students.map((s) => (s.id === studentId ? { ...s, publicFileId: fileId } : s)));
    } catch (e) {
      setSyncError("建立分享連結失敗，請重試");
    } finally {
      setShareBusy(false);
    }
  }, [drive, students, persist]);

  if (!drive.clientId) {
    return <SetupScreen onSaveClientId={drive.setClientId} />;
  }
  if (!drive.signedIn) {
    return <SignInScreen onSignIn={drive.signIn} authError={drive.authError} onResetClientId={() => drive.setClientId("")} />;
  }
  if (!loaded) {
    return <div className="min-h-screen flex items-center justify-center text-[#8A8676] text-[14px]">同步中…</div>;
  }

  const openStudent = students.find((s) => s.id === openId) || null;

  return (
    <div className="min-h-screen bg-[#F7F8F3]">
      {openStudent ? (
        <div className="relative max-w-md mx-auto min-h-screen bg-[#F7F8F3]">
          <StudentDetail
            student={openStudent}
            onBack={() => setOpenId(null)}
            onAddSession={(date, type) => persist(students.map((s) => (s.id === openId ? addSessionToStudent(s, date, type) : s)))}
            onRemoveSession={(sessionId) => persist(students.map((s) => (s.id === openId ? removeSessionFromStudent(s, sessionId) : s)))}
            onDeleteStudent={() => { persist(students.filter((s) => s.id !== openId)); setOpenId(null); }}
            onEditRate={(rate, hours, cycleLen, weekdays, email, freeLeaves) => persist(students.map((s) => (s.id === openId ? { ...s, hourlyRate: rate, sessionHours: hours, classesPerCycle: cycleLen, weekdays, email, freeLeaves } : s)))}
            onShare={() => handleShare(openId)}
            shareBusy={shareBusy}
            onSetPaid={(cycleId, paidDate) => persist(students.map((s) => (s.id === openId ? setCyclePaidDate(s, cycleId, paidDate) : s)))}
            onSetNotified={(cycleId, notifiedDate) => persist(students.map((s) => (s.id === openId ? setCycleNotifiedDate(s, cycleId, notifiedDate) : s)))}
          />
        </div>
      ) : (
        <div className="max-w-md mx-auto min-h-screen flex flex-col">
          <div className="px-4 pt-5 pb-2 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <h1 className="font-serif text-[22px] text-[#16302B]">家教記事</h1>
              <IconCloud size={14} className="text-[#0F6B5C]" />
            </div>
            {tab === "students" && (
              <button onClick={() => setShowAddStudent(true)} className="w-8 h-8 rounded-full bg-[#16302B] text-white flex items-center justify-center"><IconPlus size={17} /></button>
            )}
          </div>
          {syncError && <div className="mx-4 mb-2 text-[12px] text-[#C1533D] flex items-center gap-1"><IconAlert size={12} /> {syncError}</div>}
          <div className="flex-1">
            {tab === "students" ? (
              <div className="pt-2 pb-24">
                <DueRemindersBanner students={students} onOpen={setOpenId} />
                <div className="px-4 space-y-2.5">
                  {students.length === 0 && (
                    <div className="text-center py-16 text-[#B9B6A8]"><IconUsers size={28} className="mx-auto mb-3 opacity-60" /><p className="text-[14px]">還沒有學生，先新增一位吧</p></div>
                  )}
                  {(() => {
                    const sorted = [...students].sort((a, b) => a.name.localeCompare(b.name, "zh-Hant"));
                    const todayDow = new Date().getDay();
                    const todayStudents = sorted.filter((st) => st.weekdays && st.weekdays.includes(todayDow));
                    const restStudents = sorted.filter((st) => !(st.weekdays && st.weekdays.includes(todayDow)));
                    return (
                      <>
                        {todayStudents.map((st) => <StudentCard key={st.id} student={st} onOpen={setOpenId} />)}
                        {todayStudents.length > 0 && restStudents.length > 0 && (
                          <div className="flex items-center gap-2 py-1">
                            <div className="flex-1 h-px bg-[#E7E4D9]" />
                            <span className="text-[11px] text-[#B9B6A8]">今天沒課</span>
                            <div className="flex-1 h-px bg-[#E7E4D9]" />
                          </div>
                        )}
                        {restStudents.map((st) => <StudentCard key={st.id} student={st} onOpen={setOpenId} />)}
                      </>
                    );
                  })()}
                </div>
              </div>
            ) : tab === "income" ? <IncomeView students={students} /> : <SettlementView students={students} />}
          </div>
          <div className="sticky bottom-0 bg-[#F7F8F3]/95 backdrop-blur border-t border-[#E7E4D9] px-6 py-2.5 flex justify-around max-w-md mx-auto w-full">
            <button onClick={() => setTab("students")} className={"flex flex-col items-center gap-0.5 px-4 py-1 " + (tab === "students" ? "text-[#16302B]" : "text-[#B9B6A8]")}><IconUsers size={19} /><span className="text-[11px]">學生</span></button>
            <button onClick={() => setTab("income")} className={"flex flex-col items-center gap-0.5 px-4 py-1 " + (tab === "income" ? "text-[#16302B]" : "text-[#B9B6A8]")}><IconWallet size={19} /><span className="text-[11px]">收入</span></button>
            <button onClick={() => setTab("settlement")} className={"flex flex-col items-center gap-0.5 px-4 py-1 " + (tab === "settlement" ? "text-[#16302B]" : "text-[#B9B6A8]")}><IconCalendarCheck size={19} /><span className="text-[11px]">年度結算</span></button>
          </div>
        </div>
      )}
      {showAddStudent && (
        <AddStudentSheet onClose={() => setShowAddStudent(false)} onSave={(name, rate, hours, cycleLen, viaPlatform, weekdays, email, freeLeaves) => { persist([...students, newStudent(name, rate, hours, cycleLen, viaPlatform, weekdays, email, freeLeaves)]); setShowAddStudent(false); }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
