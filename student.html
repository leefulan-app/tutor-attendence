<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的上課記錄</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
  body { font-family: 'Noto Sans TC', sans-serif; background:#F7F8F3; margin:0; }
  .font-serif { font-family: 'Noto Serif TC', serif; }
</style>
</head>
<body>
<div id="app" class="max-w-md mx-auto min-h-screen px-4 py-8"></div>

<script>
// ⚠️ Before deploying: paste your Google Drive API key below.
// Create it in Google Cloud Console > Credentials > API key, restrict it to
// "Google Drive API" and restrict HTTP referrers to your hosting domain.
const API_KEY = "PASTE_YOUR_DRIVE_API_KEY_HERE";

const params = new URLSearchParams(location.search);
const fileId = params.get("id");
const app = document.getElementById("app");

function fmtDate(d) {
  const dt = new Date(d + "T00:00:00");
  return `${dt.getMonth() + 1}/${dt.getDate()}`;
}

function tallyHtml(cycle, total) {
  const n = total || 10;
  const classes = cycle.sessions.filter((s) => s.type === "class");
  const leaves = cycle.sessions.filter((s) => s.type === "leave");
  let marks = "";
  const dotWidth = n > 14 ? 4 : 7;
  for (let i = 0; i < n; i++) {
    const filled = !!classes[i];
    marks += `<span style="display:inline-block;width:${dotWidth}px;height:18px;border-radius:1px;margin-right:3px;background:${filled ? "#0F6B5C" : "#E4E1D6"}"></span>`;
  }
  const leaveTag = leaves.length ? `<span style="font-size:11px;color:#C1833D;font-weight:500;margin-left:6px;">請假 ${leaves.length}</span>` : "";
  return `<div style="display:flex;align-items:center;flex-wrap:wrap;">${marks}${leaveTag}</div>`;
}

function render(data) {
  const total = data.classesPerCycle || 10;
  const cycles = [...data.cycles].reverse();
  const cardsHtml = cycles.map((cycle, idx) => {
    const isCurrent = idx === 0 && !cycle.completedAt;
    if (cycle.sessions.length === 0 && !isCurrent) return "";
    const cycleNumber = data.cycles.length - idx;
    const classCount = cycle.sessions.filter((s) => s.type === "class").length;
    const statusHtml = cycle.completedAt
      ? `<span style="font-size:12px;color:#8A8676;">已於 ${fmtDate(cycle.completedAt)} 完成</span>`
      : `<span style="font-size:12px;color:#8A8676;">${classCount}/${total}</span>`;
    const rowsHtml = cycle.sessions.map((s) => `
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-top:1px solid #F0EEE3;">
        <span style="color:#16302B;">${s.date}</span>
        <span style="font-size:11px;padding:1px 6px;border-radius:4px;background:${s.type === "class" ? "rgba(15,107,92,0.1)" : "rgba(193,131,61,0.1)"};color:${s.type === "class" ? "#0F6B5C" : "#C1833D"};">
          ${s.type === "class" ? "上課" : "請假"}
        </span>
      </div>`).join("") || `<div style="padding:8px 0;font-size:13px;color:#B9B6A8;">尚無紀錄</div>`;
    return `
      <div style="background:#fff;border:1px solid #E7E4D9;border-radius:12px;padding:16px;margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
          <span style="font-size:13px;font-weight:500;color:#16302B;">第 ${cycleNumber} 輪 ${isCurrent ? '<span style="color:#0F6B5C;">（進行中）</span>' : ""}</span>
          ${statusHtml}
        </div>
        ${tallyHtml(cycle, total)}
        <div style="margin-top:10px;">${rowsHtml}</div>
      </div>`;
  }).join("");

  app.innerHTML = `
    <h1 style="font-family:'Noto Serif TC',serif;font-size:22px;color:#16302B;margin-bottom:4px;">${data.name} 的上課記錄</h1>
    <p style="font-size:12.5px;color:#8A8676;margin-bottom:20px;">資料即時同步，僅供查看</p>
    ${cardsHtml || '<p style="text-align:center;color:#B9B6A8;padding:40px 0;">還沒有紀錄</p>'}
  `;
}

function renderError(msg) {
  app.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#8A8676;font-size:14px;">${msg}</div>`;
}

if (!fileId) {
  renderError("連結不完整，請跟老師確認連結是否正確。");
} else if (!API_KEY || API_KEY === "PASTE_YOUR_DRIVE_API_KEY_HERE") {
  renderError("這個頁面尚未設定完成，請聯絡老師。");
} else {
  fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`)
    .then((res) => { if (!res.ok) throw new Error(); return res.json(); })
    .then(render)
    .catch(() => renderError("讀取資料失敗，請確認連結是否正確，或稍後再試。"));
}
</script>
</body>
</html>
